version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Astro check's current peer range is TypeScript 5/6.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
