name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Quality & browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check:content
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run check:links
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
        env:
          PLAYWRIGHT_ALL_BROWSERS: '1'
      - name: Browser report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-report
          path: playwright-report/
          retention-days: 14
      - name: Downloadable site preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Check summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Проверки пройдены
          - TypeScript, схема статей, безопасный Markdown и внутренние ссылки
          - Полнотекстовый поисковый индекс
          - Chromium desktop / Android и WebKit iPhone
          - Адаптация 320–1920 px и WCAG AA через axe

          **browser-report** — отчёт тестов. **site** — готовая сборка для локального превью.
          PR из форков проходят проверки без доступа к ключам публикации.
          SUMMARY
