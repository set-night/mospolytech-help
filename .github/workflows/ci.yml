name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Quality & browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check:content
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run check:links
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
        env:
          PLAYWRIGHT_ALL_BROWSERS: '1'
      - name: Browser report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-report
          path: playwright-report/
          retention-days: 14
      - name: Downloadable site preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Check summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Проверки пройдены
          - TypeScript, схема статей, безопасный Markdown и внутренние ссылки
          - Полнотекстовый поисковый индекс
          - Chromium desktop / Android и WebKit iPhone
          - Адаптация 320–1920 px и WCAG AA через axe

          **browser-report** — отчёт тестов. **site** — готовая сборка для локального превью.
          PR из форков проходят проверки без доступа к ключам публикации.
          SUMMARY
