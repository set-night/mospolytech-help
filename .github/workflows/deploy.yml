name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  production:
    name: Cloudflare Pages
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://polytech.help
    permissions:
      actions: read
      deployments: write
    steps:
      # No checkout, npm scripts or code execution from the downloaded artifact.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install pinned deployment tool
        working-directory: ${{ runner.temp }}
        run: npm install --prefix "$RUNNER_TEMP/deploy-tool" --no-audit --no-fund wrangler@4.155.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish checked artifact
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/deploy-tool/node_modules/.bin/wrangler" pages deploy "$GITHUB_WORKSPACE/site" --project-name polytech-help --branch main --commit-hash "$SOURCE_SHA"
          printf '### Опубликовано\n\n[polytech.help](https://polytech.help)\n\nКоммит: `%s`\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
