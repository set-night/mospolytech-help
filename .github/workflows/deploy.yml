name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  production:
    name: Cloudflare Pages
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://polytech.help
    permissions:
      actions: read
      deployments: write
    steps:
      # No checkout, npm scripts or code execution from the downloaded artifact.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install pinned deployment tool
        working-directory: ${{ runner.temp }}
        run: npm install --prefix "$RUNNER_TEMP/deploy-tool" --no-audit --no-fund wrangler@4.155.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish checked artifact
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/deploy-tool/node_modules/.bin/wrangler" pages deploy "$GITHUB_WORKSPACE/site" --project-name polytech-help --branch main --commit-hash "$SOURCE_SHA"
          printf '### Опубликовано\n\n[polytech.help](https://polytech.help)\n\nКоммит: `%s`\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
  notify-search:
    name: Notify search engines
    needs: production
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Submit published URLs through IndexNow
        # An external indexing outage cannot undo an already successful deployment.
        continue-on-error: true
        env:
          SOURCE_UPDATED_AT: ${{ github.event.workflow_run.head_commit.timestamp }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const origin = 'https://polytech.help';
          const keyLocation = `${origin}/indexnow.txt`;
          const get = async url => {
            const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
            if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
            return response.text();
          };
          const [rawKey, sitemap] = await Promise.all([get(keyLocation), get(`${origin}/sitemap.xml`)]);
          const key = rawKey.trim();
          if (!/^[a-f0-9]{32}$/.test(key)) throw new Error('Invalid public IndexNow verification file');
          const since = Date.parse(process.env.SOURCE_UPDATED_AT ?? '') - 1000;
          const entries = [...sitemap.matchAll(/<url>(.*?)<\/url>/gs)].map(match => ({
            url: match[1].match(/<loc>([^<]+)<\/loc>/)?.[1].replaceAll('&amp;', '&'),
            modified: match[1].match(/<lastmod>([^<]+)<\/lastmod>/)?.[1],
          }));
          const urlList = entries.filter(entry => !Number.isFinite(since) || entry.url === `${origin}/` || Date.parse(entry.modified ?? '') >= since).map(entry => entry.url);
          if (!urlList.length || urlList.length > 10000 || urlList.some(value => new URL(value).origin !== origin)) throw new Error('Invalid sitemap URL list');
          const response = await fetch('https://api.indexnow.org/indexnow', {
            method: 'POST', headers: { 'Content-Type': 'application/json; charset=utf-8' },
            body: JSON.stringify({ host: 'polytech.help', key, keyLocation, urlList }),
            signal: AbortSignal.timeout(20000),
          });
          if (![200,202].includes(response.status)) throw new Error(`IndexNow: HTTP ${response.status}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n### Поисковые системы\n\nIndexNow принял ${urlList.length} URL (HTTP ${response.status}). Это уведомление об обновлении, а не подтверждение индексации.\n`);
          console.log(`IndexNow accepted ${urlList.length} URLs: HTTP ${response.status}`);
          NODE
